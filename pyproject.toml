[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanics-world-models"
version = "0.1.0"
description = "Minimal visual model-based RL data collection baselines."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dm-control>=1.0.38",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
collect-cartpole = "data.collect_cartpole:main"
preview-dataset = "viz.preview_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
