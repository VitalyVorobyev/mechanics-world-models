[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanics-world-models"
version = "0.1.0"
description = "Mechanics-structured visual world model research baselines."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dm-control>=1.0.38",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "rich>=13.7",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
collect-cartpole = "data.collect_cartpole:main"
dataset-stats = "data.dataset_stats:main"
dataset-image-diagnostics = "eval.dataset_diagnostics:main"
debug-reconstruction = "eval.debug_reconstruction:main"
eval-control = "eval.eval_control:main"
eval-rssm = "eval.eval_rssm:main"
foreground-mask-preview = "eval.foreground_masks:main"
overfit-reconstruction = "eval.overfit_reconstruction:main"
preview-crop = "viz.preview_crop:main"
preview-dataset = "viz.preview_dataset:main"
plot-training-history = "viz.plot_training_history:main"
train-mechanics = "train.train_mechanics:main"
train-rssm = "train.train_rssm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
